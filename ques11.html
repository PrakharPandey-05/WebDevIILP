<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box model</title>
    <style>
        div{
            height: 200px;
            width: 200px;
        }
        p{
            margin: 0;
        }
        #first{
            background-color: aquamarine;
            padding: 20px;
            border: 10px solid black;
        }
        #second{
            background-color: red;
            border: 10px solid black;
            margin-left: 260px;
        }
        #third{
            background-color: aqua;
            border: 10px solid black;
            margin-left: 40px;
        }
    </style>
</head>
<body>
    <div id="first">
        <p>
            My name is Prakhar Pandey
        </p>
    </div>
    <div id="second">

    </div>
    <div id="third">

    </div>
</body>
</html>
